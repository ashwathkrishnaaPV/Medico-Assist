name: MedicoAssist CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        working-directory: ./server
        run: npm ci

      - name: Lint with Oxlint
        run: npx oxlint

      - name: Strict TypeScript check
        run: npx tsc -b --noEmit

      - name: Run Frontend Unit & Component Tests (Vitest)
        run: npm run test:frontend

      - name: Run Backend Core & Security Tests
        env:
          JWT_SECRET: ci-test-secret-key-at-least-32-characters-long-123456
          MONGO_URI: mongodb://127.0.0.1:27017/campushealth
          NODE_ENV: test
        run: node server/tests/run_tests.js

      - name: Production Vite Build
        run: npm run build

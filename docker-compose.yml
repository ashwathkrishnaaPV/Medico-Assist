services:
  mongo:
    image: mongo:7
    container_name: medicoassist-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: medicoassist-api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      MONGO_URI: mongodb://mongo:27017/campushealth
      JWT_SECRET: ${JWT_SECRET:-replace-with-secure-64-char-production-secret-key-before-deploy!}
      JWT_EXPIRES_IN: 1h
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost,http://localhost:5173}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
    volumes:
      - backup_data:/app/data/backups

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medicoassist-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mongo_data:
  backup_data:
